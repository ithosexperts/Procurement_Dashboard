<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Procurement Dashboard{% endblock %} – HoseXperts</title>
    <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/static/css/styles.css?v=20261119-headerstyle">
    {% block head %}{% endblock %}
</head>
<body class="portal-body">
    <!-- Executive Sapphire Navbar -->
    <nav class="navbar navbar-expand-lg app-executive-navbar sticky-top">
        <div class="container-fluid px-3 px-lg-4 py-1">
            <a class="navbar-brand d-flex align-items-center gap-2" href="/" aria-label="HoseXperts Procurement Dashboard">
                <span class="brand-logo-frame">
                    <img
                        src="/static/images/hosexperts-logo.png?v=20261105-1"
                        alt="HoseXperts – working with the flow"
                        class="hosexperts-logo"
                        width="168"
                        height="40"
                        loading="eager"
                    >
                </span>
                <span class="badge nav-portal-badge ms-2 d-none d-sm-inline-block">Procurement Dashboard</span>
            </a>
            
            <button class="navbar-toggler border-0 text-white" type="button" data-bs-toggle="collapse" data-bs-target="#navContent" aria-label="Toggle navigation">
                <i class="bi bi-list fs-4 text-white"></i>
            </button>

            <div class="collapse navbar-collapse" id="navContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-3">
                    <li class="nav-item">
                        <a class="nav-link active nav-pill-link" href="/"><i class="bi bi-speedometer2 me-1"></i> Overview</a>
                    </li>
                </ul>

                <div class="d-flex align-items-center gap-3">
                    <div class="nav-db-badge" title="Connected Database">
                        <span class="live-pulse-dot"></span>
                        <i class="bi bi-database text-white-50"></i>
                        <span class="db-name fw-medium">{{ database or 'OperationsDB' }}</span>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content Container -->
    <main class="container-fluid px-4 py-4">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="footer mt-auto py-3 bg-white border-top text-center text-muted small">
        <div class="container">
            <span>&copy; HoseXperts – Procurement Analytics &bull; Independent Portal</span>
        </div>
    </footer>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <!-- html2pdf.js for client-side PDF export -->
    <script src="/static/js/html2pdf.bundle.min.js?v=20261117-1"></script>
    <script src="/static/js/app.js?v=20261119-headerstyle"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
